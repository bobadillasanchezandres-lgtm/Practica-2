<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería Fotográfica</title>

<!-- TIPOGRAFÍA -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0a0a0a;
color:white;
font-family:'Montserrat', sans-serif;
}

/* TEXTO PRINCIPAL */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-family:'Orbitron', sans-serif;
font-size:90px;
letter-spacing:6px;
text-transform:uppercase;
}

.hero p{
margin-top:10px;
opacity:0.6;
letter-spacing:2px;
}

/* GALERÍA */
.galeria{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
gap:25px;
padding:40px;
}

/* CADA IMAGEN */
.foto{
position:relative;
overflow:hidden;
cursor:pointer;
}

.foto img{
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
}

.foto:hover img{
transform:scale(1.1);
opacity:0.8;
}

/* TEXTO ENCIMA DE LA IMAGEN */
.texto{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:15px;
background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

.texto h2{
font-family:'Orbitron', sans-serif;
letter-spacing:2px;
font-size:18px;
}

.texto p{
font-size:13px;
opacity:0.7;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0, 0, 0, 0.95);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.modal img{
max-width:80%;
max-height:80%;
}

.modal.active{
display:flex;
}

.cerrar{
position:absolute;
top:30px;
right:40px;
font-size:35px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- TEXTO SUPERIOR -->
<div class="hero">
<h1>SOLARIS TOUR</h1>
<p>Galería Fotográfica 2026</p>
</div>

<!-- GALERÍA -->
<div class="galeria">

<div class="foto">
<img src="https://picsum.photos/600/800?1">
<div class="texto">
<h2>Ciudad de México</h2>
<p>Octubre 2026</p>
</div>
</div>

<div class="foto">
<img src="https://picsum.photos/600/800?2">
<div class="texto">
<h2>Guadalajara</h2>
<p>Noviembre 2026</p>
</div>
</div>

<div class="foto">
<img src="https://picsum.photos/600/800?3">
<div class="texto">
<h2>Monterrey</h2>
<p>Diciembre 2026</p>
</div>
</div>

<div class="foto">
<img src="https://picsum.photos/600/800?4">
<div class="texto">
<h2>Querétaro</h2>
<p>Enero 2027</p>
</div>
</div>

</div>

<!-- MODAL PARA VER IMAGEN GRANDE -->
<div class="modal" id="modal">
<span class="cerrar" onclick="cerrarModal()">✕</span>
<img id="imgModal">
</div>

<script>

const fotos = document.querySelectorAll('.foto img');
const modal = document.getElementById('modal');
const imgModal = document.getElementById('imgModal');

fotos.forEach(img => {
img.addEventListener('click', () => {
modal.classList.add('active');
imgModal.src = img.src;
});
});

function cerrarModal(){
modal.classList.remove('active');
}

</script>

</body>
</html>
